# Only settings that differ from the defaults. Defaults: lazygit --config
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never
    - type: rawGit
      name: default # git's own diff, no renderer
  mainBranches: [main, master]
gui:
  nerdFontsVersion: 3
  showDivergenceFromBaseBranch: arrowAndNumber
  showCommandLog: false
  theme:
    # Tokyo Night
    activeBorderColor:
      - '#7aa2f7'
      - bold
    inactiveBorderColor:
      - '#565f89'
    searchingActiveBorderColor:
      - '#ff9e64'
    optionsTextColor:
      - '#7aa2f7'
    selectedLineBgColor:
      - '#283457'
    cherryPickedCommitBgColor:
      - '#414868'
    cherryPickedCommitFgColor:
      - '#7aa2f7'
    markedBaseCommitBgColor:
      - '#414868'
    markedBaseCommitFgColor:
      - '#7aa2f7'
    unstagedChangesColor:
      - '#f7768e'
    defaultFgColor:
      - '#c0caf5'
