# Only settings that differ from the defaults. Defaults, for the installed version:
# https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml (pick its tag)
#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# A wider parent column.
ratio       = [ 2, 4, 3 ]
show_hidden = true

[preview]
max_width  = 1200
max_height = 1000

[tasks]
file_workers    = 10
plugin_workers  = 10
fetch_workers   = 10
preload_workers = 10
process_workers = 10
image_bound     = [ 5000, 5000 ]
