#:schema https://yazi-rs.github.io/schemas/theme.json
# Tokyo Night flavor for Yazi
# Based on the Tokyo Night color scheme: https://github.com/folke/tokyonight.nvim

[mgr]
cwd = { fg = "#7aa2f7", bold = true }

find_keyword  = { fg = "#e0af68", italic = true }
find_position = { fg = "#bb9af7", bg = "reset", italic = true }

marker_selected = { fg = "#9ece6a", bg = "#9ece6a" }
marker_marked   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_copied   = { fg = "#e0af68", bg = "#e0af68" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }

count_selected = { fg = "#1a1b26", bg = "#9ece6a" }
count_copied   = { fg = "#1a1b26", bg = "#e0af68" }
count_cut      = { fg = "#1a1b26", bg = "#f7768e" }

border_symbol = "│"
border_style  = { fg = "#565f89" }

[indicator]
parent  = { fg = "#c0caf5", bg = "#283457" }
current = { fg = "#c0caf5", bg = "#283457" }
preview = { underline = true }

[tabs]
active   = { fg = "#1a1b26", bg = "#7aa2f7" }
inactive = { fg = "#a9b1d6", bg = "#363c5f" }

[mode]
normal_main = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
normal_alt  = { fg = "#7aa2f7", bg = "#363c5f" }
select_main = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
select_alt  = { fg = "#9ece6a", bg = "#363c5f" }
unset_main  = { fg = "#1a1b26", bg = "#f7768e", bold = true }
unset_alt   = { fg = "#f7768e", bg = "#363c5f" }

[status]
overall   = { fg = "#a9b1d6", bg = "#1a1b26" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#283457" }
progress_error  = { fg = "#f7768e", bg = "#283457" }

perm_type  = { fg = "#9ece6a" }
perm_read  = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec  = { fg = "#7aa2f7" }
perm_sep   = { fg = "#565f89" }

[pick]
border   = { fg = "#7aa2f7" }
active   = { fg = "#bb9af7" }
inactive = { fg = "#a9b1d6" }

[input]
border   = { fg = "#7aa2f7" }
title    = { fg = "#bb9af7" }
value    = { fg = "#c0caf5" }
selected = { reversed = true }

[cmp]
border   = { fg = "#7aa2f7" }
active   = { bg = "#283457" }
inactive = { fg = "#a9b1d6" }

[tasks]
border  = { fg = "#7aa2f7" }
title   = { fg = "#bb9af7" }
hovered = { underline = true }

[which]
border          = { fg = "#7aa2f7" }
mask            = { bg = "#1a1b26" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#565f89" }
desc            = { fg = "#bb9af7" }
separator       = "  "
separator_style = { fg = "#565f89" }

[help]
border  = { fg = "#7aa2f7" }
chord   = { fg = "#7dcfff" }
action  = { fg = "#bb9af7" }
hovered = { bg = "#283457", bold = true }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#bb9af7" },

	# Videos
	{ mime = "video/*", fg = "#e0af68" },
	{ mime = "audio/*", fg = "#e0af68" },

	# Archives
	{ mime = "application/zip",             fg = "#f7768e" },
	{ mime = "application/gzip",            fg = "#f7768e" },
	{ mime = "application/x-tar",           fg = "#f7768e" },
	{ mime = "application/x-bzip",          fg = "#f7768e" },
	{ mime = "application/x-bzip2",         fg = "#f7768e" },
	{ mime = "application/x-7z-compressed", fg = "#f7768e" },
	{ mime = "application/x-rar",           fg = "#f7768e" },

	# Documents
	{ mime = "application/pdf", fg = "#f7768e" },

	# Fallback
	{ url = "*", fg = "#c0caf5" },
	{ url = "*/", fg = "#7aa2f7" }
]
